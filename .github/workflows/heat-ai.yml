name: Backend - Heat Stress AI

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the code
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.git" repo

      - name: Run the AI service
        working-directory: repo/backend/ai-service
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
          python ai_service.py --once
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
